services:
  db:
    image: postgres:15-alpine
    container_name: ai-trading-db
    environment:
      POSTGRES_DB: ai_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_trading"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ai-trading:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-trading-api
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app:/app/src"
      LAB_DATA_DIR: /app/lab-data
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      MT5_BRIDGE_URL: ${MT5_BRIDGE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lab_data:/app/lab-data
    restart: unless-stopped

volumes:
  postgres_data:
  lab_data:
